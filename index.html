<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wish</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .hidden {
      display: none !important;
    }
    #start-btn {
      position: absolute;
      z-index: 10;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,123,255,0.4);
    }
    #status-msg {
      position: absolute;
      bottom: 30px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <button id="start-btn">Tap to Start</button>
  <div id="status-msg" class="hidden">Blow into the mic! 🎂</div>

  <video id="video1" playsinline loop muted src="video1.mp4"></video>
  <video id="video2" class="hidden" playsinline muted src="video2.mp4"></video>

  <script>
    const startBtn = document.getElementById('start-btn');
    const statusMsg = document.getElementById('status-msg');
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');

    let audioContext;
    let analyser;
    let microphone;
    let javascriptNode;
    let hasSwitched = false;

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusMsg.classList.remove('hidden');

      // Play Video 1
      video1.play().catch(err => console.error("Video 1 playback error:", err));

      // Preload Video 2
      video2.load();

      // Request microphone access
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        initMicDetection(stream);
      } catch (err) {
        alert('Microphone access is required to blow out the candle.');
        console.error(err);
      }
    });

    function initMicDetection(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

      analyser.smoothingTimeConstant = 0.3;
      analyser.fftSize = 1024;

      microphone.connect(analyser);
      analyser.connect(javascriptNode);
      javascriptNode.connect(audioContext.destination);

      javascriptNode.onaudioprocess = () => {
        if (hasSwitched) return;

        const array = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(array);
        
        let values = 0;
        for (let i = 0; i < array.length; i++) {
          values += array[i];
        }

        const average = values / array.length;

        // Sound intensity threshold for blowing
        if (average > 38) {
          hasSwitched = true;
          switchVideos();
        }
      };
    }

    function switchVideos() {
      statusMsg.classList.add('hidden');
      
      // Stop and hide Video 1
      video1.pause();
      video1.classList.add('hidden');

      // Unhide and play Video 2
      video2.classList.remove('hidden');
      video2.currentTime = 0;
      video2.play().catch(e => console.error("Video 2 play error:", e));

      if (audioContext) {
        audioContext.close();
      }
    }
  </script>
</body>
</html>
