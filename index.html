<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden; background-color: #000;
      display: flex; justify-content: center; align-items: center; font-family: sans-serif;
    }
    video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    #start-btn {
      position: absolute; z-index: 10; padding: 18px 36px; font-size: 20px;
      font-weight: bold; color: #fff; background-color: #007bff; border: none;
      border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.4);
    }
    #status-msg {
      position: absolute; bottom: 30px; z-index: 10; color: #fff;
      background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button id="start-btn">Tap to Start</button>
  <div id="status-msg" class="hidden">Blow into the mic! 🎂</div>

  <video id="video1" playsinline loop muted src="video1.mp4"></video>

  <script>
    const startBtn = document.getElementById('start-btn');
    const statusMsg = document.getElementById('status-msg');
    const video1 = document.getElementById('video1');

    let audioContext;
    let analyser;
    let microphone;
    let isBlowingDetected = false;

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusMsg.classList.remove('hidden');

      // Play continuous video loop
      video1.play().catch(e => console.error(e));

      // Request Mic Access
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startMicAnalysis(stream);
      } catch (err) {
        alert('Microphone access is required.');
      }
    });

    function startMicAnalysis(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      analyser.fftSize = 256;
      microphone.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function checkAudio() {
        if (isBlowingDetected) return;

        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
          sum += dataArray[i];
        }
        const average = sum / bufferLength;

        // When air is blown, redirect to page 2
        if (average > 25) {
          isBlowingDetected = true;
          window.location.href = "wish.html";
          return;
        }

        requestAnimationFrame(checkAudio);
      }

      checkAudio();
    }
  </script>
</body>
</html>
