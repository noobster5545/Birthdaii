<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wish</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    #video1 {
      z-index: 2;
    }
    #video2 {
      z-index: 1;
    }
    #start-btn {
      position: absolute;
      z-index: 10;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,123,255,0.4);
    }
    #status-msg {
      position: absolute;
      bottom: 30px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: none;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <button id="start-btn">Tap to Start</button>
  <div id="status-msg" class="hidden">Blow into the mic! 🎂</div>

  <video id="video1" playsinline loop muted src="video1.mp4"></video>

  <video id="video2" playsinline muted src="video2.mp4"></video>

  <script>
    const startBtn = document.getElementById('start-btn');
    const statusMsg = document.getElementById('status-msg');
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');

    let audioContext;
    let analyser;
    let microphone;
    let isSwitched = false;

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusMsg.classList.remove('hidden');

      // 1. Play Video 1 on loop
      video1.loop = true;
      await video1.play().catch(e => console.error("V1 Play Error:", e));

      // 2. UNLOCK Video 2 immediately inside the tap event
      try {
        await video2.play();
        video2.pause();
        video2.currentTime = 0;
      } catch (e) {
        console.error("V2 Unlock Error:", e);
      }

      // 3. Start Microphone Stream
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startMicAnalysis(stream);
      } catch (err) {
        alert('Microphone access is required.');
        console.error(err);
      }
    });

    function startMicAnalysis(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      
      analyser.fftSize = 256;
      microphone.connect(analyser);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function checkAudio() {
        if (isSwitched) return;

        analyser.getByteFrequencyData(dataArray);

        let sum = 0;
        for (let i = 0; i < bufferLength; i++) {
          sum += dataArray[i];
        }
        
        const average = sum / bufferLength;

        // Sensitivity threshold: 25 is ideal for detection across mobile mics
        if (average > 25) {
          isSwitched = true;
          triggerVideoSwitch();
          return;
        }

        requestAnimationFrame(checkAudio);
      }

      checkAudio();
    }

    function triggerVideoSwitch() {
      statusMsg.classList.add('hidden');

      // Hide Video 1 and bring Video 2 forward
      video1.pause();
      video1.style.display = 'none';

      // Play Video 2
      video2.currentTime = 0;
      video2.play().catch(err => console.error("V2 Play Failed:", err));

      if (audioContext) {
        audioContext.close();
      }
    }
  </script>
</body>
</html>
